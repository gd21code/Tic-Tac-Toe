<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <div class="controls">
        <input type="text" id="player1" placeholder="Player1 Name 'X'" value="Player1"/>
        <input type="text" id="player2" placeholder="Player2 Name 'O'" value="Player2"/>
        <button id="restart-button">Restart Game</button>
    </div>

    <h2 id="message"></h2>

    <div id="gameboard"></div>

    <script src="script.js"></script>
</body>
</html>
